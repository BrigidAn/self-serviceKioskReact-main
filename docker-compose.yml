# One-command demo:  cp .env.example .env  &&  docker compose up --build
# Then open http://localhost:3000  (API + Swagger: http://localhost:8080/swagger)
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # runs under emulation on Apple Silicon
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    volumes:
      - kiosk-db:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./KioskAPI
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development # enables Swagger UI
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=kiosk;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-3000}
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "true"
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./tech-kiosk-fr
      args:
        REACT_APP_API_URL: http://localhost:${API_PORT:-8080}/api
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  kiosk-db:
